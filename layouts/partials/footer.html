<footer class="border-t border-border mt-20">
  <div class="max-w-5xl mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
    <div class="flex items-center gap-2 text-muted-foreground text-sm font-mono"><span class="text-primary">fn</span> init() {<span> // © {{ now.Year }} {{ site.Params.author }}</span>}</div>
    <div class="flex items-center gap-6">
      <a href="{{ site.Params.github }}" target="_blank" rel="noopener noreferrer" class="text-muted-foreground hover:text-foreground transition-colors">{{ partial "icon.html" (dict "name" "github" "class" "w-5 h-5") }}<span class="sr-only">GitHub</span></a>
      <a href="{{ site.Params.linkedin }}" target="_blank" rel="noopener noreferrer" class="text-muted-foreground hover:text-foreground transition-colors">{{ partial "icon.html" (dict "name" "linkedin" "class" "w-5 h-5") }}<span class="sr-only">LinkedIn</span></a>
      <a href="mailto:{{ site.Params.email }}" class="text-muted-foreground hover:text-foreground transition-colors">{{ partial "icon.html" (dict "name" "mail" "class" "w-5 h-5") }}<span class="sr-only">Email</span></a>
    </div>
  </div>
</footer>
