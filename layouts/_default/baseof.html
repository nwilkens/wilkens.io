<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{- $title := site.Title -}}
    {{- if not .IsHome }}{{ $title = printf "%s | %s" .Title site.Params.author }}{{ end -}}
    {{- $desc := .Description | default site.Home.Description }}
    <title>{{ $title }}</title>
    <link rel="canonical" href="{{ .Permalink }}" />
    <meta name="robots" content="index,follow" />
    <meta name="description" content="{{ $desc }}" />
    <meta property="og:title" content="{{ $title }}" />
    <meta property="og:description" content="{{ $desc }}" />
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:site_name" content="wilkens.io" />
    <meta property="og:image" content="{{ "opengraph.jpg" | absURL }}" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="{{ site.Params.ogImageAlt }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ $title }}" />
    <meta name="twitter:description" content="{{ $desc }}" />
    <meta name="twitter:image" content="{{ "opengraph.jpg" | absURL }}" />
    <meta name="twitter:image:alt" content="{{ site.Params.ogImageAlt }}" />
    <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" />
    <link rel="alternate" type="application/rss+xml" title="wilkens.io" href="{{ "index.xml" | absURL }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/extra.css" | relURL }}">
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </head>
  <body>
    <div class="min-h-screen flex flex-col bg-background text-foreground dark selection:bg-primary/30">
      {{ partial "header.html" . }}
      <main class="flex-grow pt-24 pb-12">{{ block "main" . }}{{ end }}</main>
      {{ partial "footer.html" . }}
    </div>
  </body>
</html>
