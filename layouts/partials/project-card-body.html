<div class="flex items-start justify-between mb-4"><h3 class="text-lg font-bold group-hover:text-primary transition-colors">{{ .name }}</h3>{{ if .url }}{{ partial "icon.html" (dict "name" "arrow-right" "class" "w-4 h-4 text-muted-foreground group-hover:text-primary transition-colors") }}{{ end }}</div>
<p class="text-muted-foreground mb-6 flex-grow">{{ .description }}</p>
<div class="flex flex-wrap gap-2">{{ range .tags }}<span class="px-2 py-1 text-xs font-mono bg-muted text-muted-foreground rounded">{{ . }}</span>{{ end }}</div>
